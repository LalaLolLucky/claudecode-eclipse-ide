name: Deploy update site

# Phase A: build from whatever's already committed under native/ and publish
# straight to GitHub Pages as a build artifact -- no git commit involved.
# The 9-target native cross-compile matrix (replacing the committed
# binaries with freshly-built ones) is a separate follow-up on top of this.
#
# Manual only: nothing publishes without someone with write access
# explicitly clicking "Run workflow".
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build p2 site with Tycho
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - run: mvn -B integration-test

      # Keep the published p2 site at the same path it has always lived at
      # (.../com.anthropic.claudecode.eclipse.site/) rather than the Pages
      # root, since every existing install's update-site URL and the
      # README's install instructions already point there.
      - name: Stage p2 site at its historical path
        run: |
          mkdir -p _site/com.anthropic.claudecode.eclipse.site
          cp -r com.anthropic.claudecode.eclipse.site/target/repository/. _site/com.anthropic.claudecode.eclipse.site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

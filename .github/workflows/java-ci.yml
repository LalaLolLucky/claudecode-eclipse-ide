name: Java CI

on:
  # Every PR, so the build & test checks can be required without leaving a
  # PR that touches no Java code waiting on a check that never runs.
  pull_request:
  push:
    branches: [master, dev]
    paths:
      - "com.anthropic.claudecode.eclipse/**"
      - "com.anthropic.claudecode.eclipse.feature/**"
      - "com.anthropic.claudecode.eclipse.site/**"
      - "pom.xml"
      - "claudecode.target"
      - ".mvn/**"
      - ".github/workflows/java-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test (Tycho)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # No OS matrix needed here, unlike rust-ci.yml: Java bytecode is
      # host-independent, and claudecode.target already lists all three
      # (os, ws, arch) environments simultaneously so the plugin compiles
      # regardless of which one is actually running the build.
      #
      # src/core/ is in bin.includes, so the Rust sources must be copied in
      # first, exactly as deploy.yml does; Tycho fails on a missing entry.
      - name: Copy the Rust sources into src/core
        run: |
          set -eu
          mkdir -p com.anthropic.claudecode.eclipse/src/core
          cp -r claude-eclipse-core/src/. com.anthropic.claudecode.eclipse/src/core/

      - run: mvn -B integration-test

      # Install the site just built into a bare Eclipse Platform at the oldest
      # supported release -- no JDT, CDT or PyDev -- with only the Eclipse
      # update site a stock install already has. The p2 director is the
      # resolver behind Install New Software, so this fails exactly where a
      # user's install would: a hard dependency on optional language tooling
      # (#47), or a version floor above what that release ships (#148).
      #
      # 4.37 (2025-09) is the first release with org.eclipse.terminal.*;
      # 2025-06 only has the older org.eclipse.tm.terminal.* bundles.
      - name: Install into a bare Eclipse Platform (oldest supported)
        env:
          PLATFORM_VERSION: "4.37"
          PLATFORM_DROP: R-4.37-202509050730
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tarball="eclipse-platform-${PLATFORM_VERSION}-linux-gtk-x86_64.tar.gz"
          drop="https://download.eclipse.org/eclipse/downloads/drops4/${PLATFORM_DROP}"
          curl -fsSL -o "$tarball" "$drop/$tarball"
          curl -fsSL "$drop/checksum/eclipse-${PLATFORM_VERSION}-SUMSSHA512" \
            | grep " \*${tarball}\$" | sha512sum -c -
          tar -xzf "$tarball"
          profile=$(sed -n 's/^eclipse\.p2\.profile=//p' eclipse/configuration/config.ini)
          java -jar eclipse/plugins/org.eclipse.equinox.launcher_*.jar -nosplash -consoleLog \
            -application org.eclipse.equinox.p2.director \
            -repository "file://$GITHUB_WORKSPACE/com.anthropic.claudecode.eclipse.site/target/repository,https://download.eclipse.org/eclipse/updates/${PLATFORM_VERSION}" \
            -installIU com.anthropic.claudecode.eclipse.feature.feature.group \
            -destination "$RUNNER_TEMP/eclipse" -profile "$profile"

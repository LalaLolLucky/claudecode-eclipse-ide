name: Rust CI

on:
  # Every PR, so the build & test checks can be required without leaving a
  # PR that touches no Rust code waiting on a check that never runs.
  pull_request:
  push:
    branches: [master, dev]
    paths:
      - "claude-eclipse-core/**"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: claude-eclipse-core

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09), pins to latest stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      # The existing tree isn't fmt-clean and has pre-existing clippy findings
      # (mostly on macos-latest/windows-latest, ~20 lint hits, 0 build errors),
      # so these are visibility-only for now rather than blocking every PR
      # that doesn't happen to touch the offending lines. Run `cargo fmt` and
      # `cargo clippy --fix` once on master, then drop `continue-on-error` and
      # add `-- -D warnings` back to clippy to make both required.
      - run: cargo fmt --check
        continue-on-error: true
      - run: cargo clippy --locked --all-targets
        continue-on-error: true

  # GitHub has no FreeBSD runners, so this boots a FreeBSD VM on an Ubuntu
  # runner. 14.3 matches the sysroot build-natives.ps1 links the shipped
  # FreeBSD library against.
  freebsd:
    name: build & test (freebsd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          release: "14.3"
          usesh: true
          prepare: |
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            cd claude-eclipse-core
            cargo build --locked --all-targets
            cargo test --locked
